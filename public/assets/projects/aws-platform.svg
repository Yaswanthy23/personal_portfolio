<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <rect width="600" height="340" rx="12" fill="#0E172A" />
  <rect x="0.5" y="0.5" width="599" height="339" rx="11.5" stroke="#263449" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF7700" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#grid)" opacity="0.6"/>

  <!-- Top Header bar -->
  <rect x="20" y="20" width="560" height="36" rx="6" fill="#172033" stroke="#263449" />
  <circle cx="42" cy="38" r="5" fill="#EF4444" />
  <circle cx="58" cy="38" r="5" fill="#F59E0B" />
  <circle cx="74" cy="38" r="5" fill="#22C55E" />
  <text x="96" y="42" fill="#94A3B8" font-family="monospace" font-size="12">aws-vpc-architecture // terraform-state: locked</text>
  <rect x="475" y="27" width="90" height="22" rx="4" fill="#FF9900" fill-opacity="0.15" stroke="#FF9900" stroke-width="0.5"/>
  <text x="490" y="42" fill="#FF9900" font-family="monospace" font-size="11" font-weight="600">AWS :: EKS</text>

  <!-- Connectors -->
  <path d="M 170 120 L 300 120 L 300 180" stroke="#374863" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 430 120 L 300 120" stroke="#374863" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 300 240 L 300 280" stroke="#FF9900" stroke-width="2" />
  <path d="M 300 280 L 160 280" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M 300 280 L 440 280" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Node 1: Terraform IaC -->
  <rect x="60" y="90" width="140" height="60" rx="8" fill="#172033" stroke="#FF9900" stroke-width="1.5" />
  <rect x="72" y="105" width="28" height="28" rx="4" fill="#FF9900" fill-opacity="0.1" />
  <text x="79" y="124" fill="#FF9900" font-family="sans-serif" font-size="14" font-weight="bold">IaC</text>
  <text x="110" y="116" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">Terraform</text>
  <text x="110" y="134" fill="#94A3B8" font-family="monospace" font-size="10">v1.8+ Modules</text>

  <!-- Node 2: Multi-AZ VPC -->
  <rect x="400" y="90" width="140" height="60" rx="8" fill="#172033" stroke="#263449" stroke-width="1.5" />
  <rect x="412" y="105" width="28" height="28" rx="4" fill="#22D3EE" fill-opacity="0.1" />
  <text x="417" y="124" fill="#22D3EE" font-family="sans-serif" font-size="12" font-weight="bold">VPC</text>
  <text x="450" y="116" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">AWS Network</text>
  <text x="450" y="134" fill="#94A3B8" font-family="monospace" font-size="10">Multi-AZ Subnets</text>

  <!-- Central Node: Amazon EKS Cluster -->
  <rect x="210" y="180" width="180" height="64" rx="8" fill="#172033" stroke="#22D3EE" stroke-width="1.5" />
  <circle cx="235" cy="212" r="14" fill="#22D3EE" fill-opacity="0.15" />
  <text x="228" y="217" fill="#22D3EE" font-family="sans-serif" font-size="14">☸</text>
  <text x="260" y="206" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600">Amazon EKS</text>
  <text x="260" y="226" fill="#22C55E" font-family="monospace" font-size="11">● Active / Autoscaled</text>

  <!-- Bottom Node 1: Worker Nodes -->
  <rect x="90" y="255" width="130" height="50" rx="6" fill="#111827" stroke="#263449" />
  <text x="105" y="278" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">Node Groups</text>
  <text x="105" y="293" fill="#94A3B8" font-family="monospace" font-size="10">EC2 m5.large</text>

  <!-- Bottom Node 2: Observability -->
  <rect x="380" y="255" width="130" height="50" rx="6" fill="#111827" stroke="#263449" />
  <text x="395" y="278" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">CloudWatch</text>
  <text x="395" y="293" fill="#94A3B8" font-family="monospace" font-size="10">Alarms & Logs</text>
</svg>
